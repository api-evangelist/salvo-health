name: Salvo Health
description: 'Salvo Health is a virtual care company delivering continuous gastrointestinal
  and metabolic care through integrated, tech-enabled clinical teams. Its platform pairs
  registered dietitians, licensed nurses, and behavioral health specialists with a patient
  mobile app and remote patient monitoring to manage conditions including IBS, obesity,
  GLP-1/anti-obesity therapy, and fatty liver disease (MASH/MASLD). Adherence data and
  monthly patient reports are integrated directly into provider EHR systems. Salvo Health
  is a portfolio company of Threshold Ventures. As of this profile the company exposes
  no public developer API, SDK, or documentation surface; this record captures its public
  identity and web properties for the API Evangelist network.'
